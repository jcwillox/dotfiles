- system:
    - os: darwin
      then:
        - package:
            - brew: gh
    - family: arch
      then:
        - package:
            - pacman: github-cli
    - arch: amd64
      os: linux
      then:
        - install:
            name: "GitHub CLI"
            url: https://github.com/cli/cli
            sudo: true
            download:
              url: "/releases/download/v{{ .Version }}/gh_{{ .Version }}_linux_amd64.deb"
            shell:
              command: "dpkg -i {{.Path}}"


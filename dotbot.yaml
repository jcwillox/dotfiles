config:
  - group: !include_dir_named "dotbot"

profiles:
  windows:
    - windows
    - bat
    - fastfetch
    - vim
  ubuntu: &ubuntu
    - linux
    - zsh
    - eza
    - bat
    - fastfetch
    - vim
    - dust
    - sd
    - delta
    - yazi
  darwin:
    - *ubuntu
    - gh
    - fnm
  full: &full
    - *ubuntu
    - hacking_tools
    - gdb
    - gh
    - fnm
  cachyos:
    - *ubuntu
    - gh
    - fnm
    - mpv
    - golang
    - seclists
    - task
    - cachyos
  kali:
    - *full
    - python2
  wsl:
    - *full
    - golang
    - seclists
    - task
    - wsl

default_profile:
  - windows: '{{ eq OS "windows" }}'
  - full: '{{ env "CI" }}'
  - wsl:  '{{ IsWSL }}'
  - kali: '{{ MatchDistro "kali" }}'
  - cachyos: '{{ MatchDistro "cachyos" }}'
  - darwin: '{{ eq OS "darwin" }}'
  - ubuntu

strip_path: true
